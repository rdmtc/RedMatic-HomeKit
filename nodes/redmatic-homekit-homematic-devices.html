<script type="text/javascript">
    RED.nodes.registerType('redmatic-homekit-homematic-devices', {
        category: 'redmatic homekit',
        defaults: {
            ccuConfig: {value: 'localhost', type: 'ccu-connection', required: true},
            bridgeConfig: {value: 'CC:22:3D:E3:CE:C7:51826', type: 'redmatic-homekit-bridge', required: true},
            devices: {value: {}}
        },
        inputs: 0,
        outputs: 0,
        icon: 'homekit2.png',
        color: '#E2D96E',
        paletteLabel: 'homematic',
        align: 'left',
        label() {
            return this.name || 'homematic';
        },
        labelStyle() {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare() {
            const that = this;
            if (!this.devices) {
                this.devices = {};
            }

            // for text and for double-quoted attribute values (a CCU name may carry quotes)
            function escape(text) {
                return $('<div>').text(String(text)).html().replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            function dropdownHtml(ch, dropdowns) {
                let html = '';
                Object.keys(dropdowns || {}).forEach(option => {
                    if (!that.devices[ch]) {
                        that.devices[ch] = {};
                    }
                    const selected = that.devices[ch][option];
                    html += '<select class="small channel-option" data-addr="' + ch + '" data-option="' + option + '">';
                    dropdowns[option].forEach(val => {
                        html += '<option' + (selected === val ? ' selected' : '') + '>' + escape(val) + '</option>';
                    });
                    html += '</select>';
                });
                return html;
            }

            // hap-nodejs' name check: first and last character a letter or digit
            const homekitName = /^[\p{L}\p{N}][\p{L}\p{N}\p{Zs}\u2019'&!._:;()/,-]*[\p{L}\p{N}]$/u;

            // HomeKit name of a device or channel (#388): empty = the CCU name, shown as placeholder
            function nameInput(addr, ccuName) {
                const stored = that.devices[addr] && typeof that.devices[addr].name === 'string' ? that.devices[addr].name : '';
                return '<input class="homekit-name" type="text" data-addr="' + escape(addr) + '" data-ccu-name="' +
                    escape(ccuName) + '" placeholder="' + escape(ccuName) + '" value="' + escape(stored) + '">';
            }

            function checkName() {
                const value = $(this).val().trim() || String($(this).data('ccu-name'));
                const valid = homekitName.test(value);
                $(this).toggleClass('homekit-name-warning', !valid).attr('title', valid ? '' :
                    'HomeKit: der Name sollte mit einem Buchstaben oder einer Ziffer beginnen und enden / ' +
                    'the name should start and end with a letter or digit');
            }

            function channelRow(addr, ch, name, extra, html, named) {
                return '<tr class="device-options" data-addr="' + addr + '"><td></td><td class="text small">' +
                    '<input class="device-enabled ' + extra + '" data-addr="' + ch + '" type="checkbox">' +
                    escape(name) + '</td><td class="name-cell">' + (named ? nameInput(ch, name) : '') + '</td>' +
                    '<td class="text small">' + escape(ch) + '</td><td class="text small">' + html + '</td></tr>';
            }

            function addDevice(dev) {
                const addr = dev.address;
                if (!that.devices[addr]) {
                    that.devices[addr] = {};
                }
                // opt-in devices (the CCU's virtual remote) are stored as enabled: true, like virtual channels
                const checked = dev.optIn ? Boolean(that.devices[addr].enabled) : !that.devices[addr].disabled;
                const cls = dev.optIn ? 'device-enabled option-hide vchannel-enabled' : 'device-enabled option-hide';
                $('#devices').append('<tr><td class="enabled"><input class="' + cls + '" data-addr="' + addr + '" type="checkbox"' + (checked ? ' checked' : '') + '></td><td class="text">' + escape(dev.name) + (dev.optIn ? ' <span class="small">(opt-in)</span>' : '') + '</td><td class="name-cell">' + nameInput(addr, dev.name) + '</td><td class="text small">' + escape(addr) + '</td><td class="text small">' + escape(dev.type) + '</td></tr>');

                dev.options.forEach(option => {
                    const ch = addr + ':' + option;
                    if (!that.devices[ch]) {
                        that.devices[ch] = {};
                    }
                    const $row = $(channelRow(addr, ch, option, 'channel-enabled', '', false));
                    $row.find('input[type="checkbox"]').prop('checked', !that.devices[ch].disabled);
                    $('#devices').append($row);
                });

                dev.channels.forEach(channel => {
                    const ch = channel.address;
                    if (!that.devices[ch]) {
                        that.devices[ch] = {};
                    }
                    const html = dropdownHtml(ch, channel.dropdowns);
                    if (channel.virtual) {
                        // HmIP virtual receiver channels are opt-in (stored as enabled: true)
                        const $row = $(channelRow(addr, ch, channel.name, 'vchannel-enabled', html, true));
                        $row.find('input[type="checkbox"]').prop('checked', Boolean(that.devices[ch].enabled));
                        $('#devices').append($row);
                    } else {
                        const $row = $(channelRow(addr, ch, channel.name, 'channel-enabled', html, true));
                        $row.find('input[type="checkbox"]').prop('checked', !that.devices[ch].disabled).prop('disabled', Boolean(channel.fixed));
                        $('#devices').append($row);
                    }
                });
            }

            if (this.ccuConfig && this.ccuConfig !== '_ADD_') {
                $('#spinner').show();
                $('.config').hide();
                $.getJSON('redmatic-homekit/homematic-devices?config=' + this.ccuConfig, devices => {
                    devices.forEach(addDevice);
                    $('.homekit-name').on('input', checkName).each(checkName);
                    // Enter in a name field must not submit Node-RED's edit form: the form's
                    // implicit submission "clicks" its first submit button, which was
                    // "disable all" in 4.1.0 and unchecked every device (#388)
                    $('.homekit-name').on('keydown', function (event) {
                        if (event.key === 'Enter') {
                            event.preventDefault();
                            $(this).blur();
                        }
                    });

                    $('.option-hide').each(function () {
                        $(this).change(function () {
                            const addr = $(this).data('addr');
                            $('.device-options[data-addr="' + addr + '"]').toggle($(this).is(':checked'));
                        }).trigger('change');
                    });
                    $('#spinner').hide();
                    $('.config').show();
                }).fail(() => {
                    $('#spinner').hide();
                    $('#devices').html('<tr><td>CCU connection not ready - deploy the CCU config node first</td></tr>');
                    $('.config').show();
                });
            }

            $('#disable-all').click(() => {
                $('.option-hide').prop('checked', false).trigger('change');
            });
            $('#enable-all').click(() => {
                $('.option-hide').prop('checked', true).trigger('change');
            });
        },
        oneditsave() {
            const devices = {};
            const listed = new Set();
            const entry = addr => {
                if (!devices[addr]) {
                    devices[addr] = {};
                }
                return devices[addr];
            };
            $('.channel-option').each(function () {
                entry($(this).data('addr'))[$(this).data('option')] = $(this).val();
            });
            // HomeKit name (#388): stored only when set; empty means the CCU name
            $('.homekit-name').each(function () {
                const name = String($(this).val() || '').trim();
                if (name) {
                    entry($(this).data('addr')).name = name;
                }
            });
            // Devices, channels and pseudo-options are stored as {disabled: true} when
            // unchecked (absent = enabled); opt-in rows (virtual receivers, buttons on
            // actuators, the CCU's virtual remote) the other way round as {enabled: true}.
            // Only the flag of the current state is written, so a row that was unchecked
            // before and is checked now loses its old flag — 4.0.0 carried it over and a
            // device could never be re-enabled (#384).
            $('.device-enabled').each(function () {
                const addr = $(this).data('addr');
                const checked = $(this).is(':checked');
                const optIn = $(this).hasClass('vchannel-enabled');
                listed.add(addr);
                if (optIn ? checked : !checked) {
                    entry(addr)[optIn ? 'enabled' : 'disabled'] = true;
                }
            });
            // keep settings of devices that were not listed this time (e.g. CCU
            // temporarily without that interface) instead of dropping them
            Object.keys(this.devices || {}).forEach(addr => {
                const previous = this.devices[addr];
                if (!listed.has(addr) && !devices[addr] && previous && Object.keys(previous).length > 0) {
                    devices[addr] = previous;
                }
            });
            this.devices = devices;
        }
    });
</script>

<script type="text/x-red" data-template-name="redmatic-homekit-homematic-devices">

    <div class="form-row">
        <label for="node-input-ccuConfig"><i class="icon-globe"></i> CCU</label>
        <input type="text" id="node-input-ccuConfig">
    </div>
    <div class="form-row">
        <label for="node-input-bridgeConfig"><i class="icon-globe"></i> Bridge</label>
        <input type="text" id="node-input-bridgeConfig">
    </div>
    <style>
        /* Fixed layout: the columns follow the <colgroup>, not their content, so the HomeKit
           name column takes whatever the edit tray leaves (it scales with the tray, #388) and a
           long CCU name is cut with an ellipsis instead of widening the row. */
        #devices {
            width: 100%;
            table-layout: fixed;
        }
        #devices col.col-enabled {
            width: 22px;
        }
        #devices col.col-ccu-name {
            width: 28%;
        }
        #devices col.col-address {
            width: 25%;
        }
        #devices col.col-type {
            width: 15%;
        }
        #devices td.text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #devices td.name-cell {
            padding: 1px 4px;
        }
        #devices td.small {
            font-size: 10px;
        }
        #devices td.enabled {
            width: 16px;
            display: block;
            margin-top: -2px;
        }

        .channel-enabled, .vchannel-enabled {
            width: 11px !important;
            margin-top: -1px !important;
            margin-right: 2px !important;
        }

        /* "#devices" first: Node-RED's own rule for .red-ui-editor input[type=text] (34px high,
           70% wide, 14px) is more specific than a bare input.homekit-name and won before (#388);
           the field has the height of the dropdowns in the same list, not of a form-row input. */
        #devices input.homekit-name {
            box-sizing: border-box;
            width: 100%;
            height: 18px;
            padding: 0 4px;
            margin: 0;
            font-size: 10px;
            line-height: 16px;
        }

        #devices input.homekit-name.homekit-name-warning {
            border-color: #e8a33d;
        }

        #devices select.small {
            box-sizing: border-box;
            width: 100%;
            height: 18px;
            padding: 0;
            margin: 0;
            font-size: 10px;
            line-height: 16px;
        }


    </style>
    <div class="form-row">
        <div style="width: 100%; display: flex">
            <img id="spinner" src="red/images/spin.svg" style="margin: auto; display: none;">
        </div>
        <div class="config" style="width: 100%; display: none">
            <!-- type="button": inside Node-RED's edit form a button without a type is a submit button,
                 and Enter in a text field would "click" the first one - 4.1.0's "disable all" (#388) -->
            <button type="button" id="disable-all" style="margin-right: 12px;">disable all</button>
            <button type="button" id="enable-all">enable all</button>
        </div>
        <table class="config" id="devices">
            <!-- the columns' widths (table-layout: fixed): checkbox, CCU name, HomeKit name (the rest), address, type/options -->
            <colgroup>
                <col class="col-enabled">
                <col class="col-ccu-name">
                <col class="col-homekit-name">
                <col class="col-address">
                <col class="col-type">
            </colgroup>
        </table>
    </div>

</script>

<script type="text/x-red" data-help-name="redmatic-homekit-homematic-devices">
    <p>Legt für die Geräte einer CCU-Verbindung (node-red-contrib-ccu) automatisch HomeKit-Zubehör an.</p>
    <h3>Geräteliste</h3>
    <p>Die Liste zeigt alle Geräte der aktivierten Schnittstellen, die der Node abbilden kann. Pro Gerät lässt sich
    das Zubehör ein- und ausschalten; darunter erscheinen je nach Gerät die einzelnen Kanäle mit Optionen:</p>
    <dl class="message-properties">
        <dt>Typ-Auswahl</dt><dd>Als was ein Kanal in HomeKit erscheint, z.&nbsp;B. Schalter, Steckdose, Lampe,
            Lüfter, Ventil bei Schaltaktoren oder Kontaktsensor, Tür, Fenster, Garagentor bei Kontakten.</dd>
        <dt>SingleAccessory</dt><dd>Bei mehrkanaligen Aktoren: alle Kanäle in einem Zubehörteil (Standard) oder
            ein eigenes Zubehörteil je Kanal.</dd>
        <dt>Virtuelle Kanäle</dt><dd>Die zweiten und dritten virtuellen Empfängerkanäle von HmIP-Aktoren
            (z.&nbsp;B. <code>:5</code>, <code>:6</code>) und die Taster an Aktoren sind abwählbar und standardmäßig aus.</dd>
        <dt>Battery, HumiditySensor, LightSensor, BoostSwitch, …</dt><dd>Zusätzliche Services, die sich pro
            Gerät abschalten lassen.</dd>
    </dl>
    <h3>HomeKit-Name</h3>
    <p>Das Textfeld neben dem CCU-Namen eines Geräts oder Kanals legt einen anderen Namen für HomeKit fest; leer
    bleibt der Name aus der CCU (als Platzhalter angezeigt). Der Name in der CCU wird nicht verändert, und das
    Zubehörteil behält seine Identität (sie hängt an der Geräteadresse): Raum, Szenen und Automationen bleiben,
    nichts muss neu gekoppelt werden.</p>
    <p>Ein Zubehörteil, das schon in der Home-App ist, behält dort den Namen, den die Home-App beim Hinzufügen
    gespeichert hat; der HomeKit-Name wirkt vor allem für neu hinzugefügte Zubehörteile und Kanäle. Umbenennen
    lässt es sich in der Home-App selbst.</p>
    <p>HomeKit möchte Namen, die mit einem Buchstaben oder einer Ziffer beginnen und enden. Sonst schreibt
    HAP-NodeJS beim Deploy die Warnung <i>„has an invalid 'Name' characteristic“</i> ins Log, und das Feld ist
    orange umrandet. Ein HomeKit-Name wie <code>Wandtaster Treppenlicht 1.OG unten</code> statt
    <code>… 1.OG (unten)</code> beseitigt die Warnung.</p>
    <p><i>English:</i> the text field next to a device's or channel's CCU name sets a different name for HomeKit;
    empty keeps the CCU name (shown as placeholder). The CCU name is not changed, and the accessory keeps its
    identity (it follows the device address), so rooms, scenes and automations stay and nothing needs re-pairing.
    An accessory already added to the Home app keeps the name the Home app stored when it was added; the HomeKit
    name mainly applies to newly added accessories and channels (rename existing ones in the Home app). HomeKit
    wants names that start and end with a letter or digit; otherwise HAP-NodeJS logs <i>"has an invalid 'Name'
    characteristic"</i> on deploy and the field gets an orange border. A HomeKit name that starts and ends with a
    letter or digit removes that warning.</p>
    <h3>Geräteunterstützung</h3>
    <p>Für bekannte Gerätetypen gibt es speziell abgestimmte Module. Alle anderen Geräte werden aus ihrer
    Gerätebeschreibung (Kanaltypen und Datenpunkte) zugeordnet; das umfasst auch neue, Homebrew- und
    CUxD-Geräte. Fehlt ein Gerät, bitte ein Issue mit dem Gerätetyp öffnen.</p>
    <h3>Hinweise</h3>
    <p>Gerätenamen werden von der CCU übernommen (Kanalnamen für Kanäle), sofern kein HomeKit-Name gesetzt ist. Zubehörteile behalten ihre Identität
    über Neustarts und Updates, solange die Geräteadresse gleich bleibt. Nach dem Ändern der Auswahl ist ein
    Deploy nötig; neue Zubehörteile erscheinen in der Home-App im Standardraum.</p>
</script>
