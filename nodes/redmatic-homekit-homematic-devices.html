<script type="text/javascript">
    RED.nodes.registerType('redmatic-homekit-homematic-devices', {
        category: 'redmatic homekit',
        defaults: {
            ccuConfig: {value: 'localhost', type: 'ccu-connection', required: true},
            bridgeConfig: {value: 'CC:22:3D:E3:CE:C7:51826', type: 'redmatic-homekit-bridge', required: true},
            devices: {value: {}}
        },
        inputs: 0,
        outputs: 0,
        icon: 'homekit2.png',
        color: '#E2D96E',
        paletteLabel: 'homematic',
        align: 'left',
        label() {
            return this.name || 'homematic';
        },
        labelStyle() {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare() {
            const that = this;
            if (!this.devices) {
                this.devices = {};
            }

            function escape(text) {
                return $('<div>').text(String(text)).html();
            }

            function dropdownHtml(ch, dropdowns) {
                let html = '';
                Object.keys(dropdowns || {}).forEach(option => {
                    if (!that.devices[ch]) {
                        that.devices[ch] = {};
                    }
                    const selected = that.devices[ch][option];
                    html += '<select class="small channel-option" data-addr="' + ch + '" data-option="' + option + '">';
                    dropdowns[option].forEach(val => {
                        html += '<option' + (selected === val ? ' selected' : '') + '>' + escape(val) + '</option>';
                    });
                    html += '</select>';
                });
                return html;
            }

            function channelRow(addr, ch, name, extra, html) {
                return '<tr class="device-options" data-addr="' + addr + '"><td></td><td class="text small">' +
                    '<input class="device-enabled ' + extra + '" data-addr="' + ch + '" type="checkbox">' +
                    escape(name) + '</td><td class="text small">' + escape(ch) + '</td><td class="text small">' + html + '</td></tr>';
            }

            function addDevice(dev) {
                const addr = dev.address;
                if (!that.devices[addr]) {
                    that.devices[addr] = {};
                }
                // opt-in devices (the CCU's virtual remote) are stored as enabled: true, like virtual channels
                const checked = dev.optIn ? Boolean(that.devices[addr].enabled) : !that.devices[addr].disabled;
                const cls = dev.optIn ? 'device-enabled option-hide vchannel-enabled' : 'device-enabled option-hide';
                $('#devices').append('<tr><td class="enabled"><input class="' + cls + '" data-addr="' + addr + '" type="checkbox"' + (checked ? ' checked' : '') + '></td><td class="text">' + escape(dev.name) + (dev.optIn ? ' <span class="small">(opt-in)</span>' : '') + '</td><td class="text small">' + escape(addr) + '</td><td class="text small">' + escape(dev.type) + '</td></tr>');

                dev.options.forEach(option => {
                    const ch = addr + ':' + option;
                    if (!that.devices[ch]) {
                        that.devices[ch] = {};
                    }
                    const $row = $(channelRow(addr, ch, option, 'channel-enabled', ''));
                    $row.find('input').prop('checked', !that.devices[ch].disabled);
                    $('#devices').append($row);
                });

                dev.channels.forEach(channel => {
                    const ch = channel.address;
                    if (!that.devices[ch]) {
                        that.devices[ch] = {};
                    }
                    const html = dropdownHtml(ch, channel.dropdowns);
                    if (channel.virtual) {
                        // HmIP virtual receiver channels are opt-in (stored as enabled: true)
                        const $row = $(channelRow(addr, ch, channel.name, 'vchannel-enabled', html));
                        $row.find('input').prop('checked', Boolean(that.devices[ch].enabled));
                        $('#devices').append($row);
                    } else {
                        const $row = $(channelRow(addr, ch, channel.name, 'channel-enabled', html));
                        $row.find('input').prop('checked', !that.devices[ch].disabled).prop('disabled', Boolean(channel.fixed));
                        $('#devices').append($row);
                    }
                });
            }

            if (this.ccuConfig && this.ccuConfig !== '_ADD_') {
                $('#spinner').show();
                $('.config').hide();
                $.getJSON('redmatic-homekit/homematic-devices?config=' + this.ccuConfig, devices => {
                    devices.forEach(addDevice);

                    $('.option-hide').each(function () {
                        $(this).change(function () {
                            const addr = $(this).data('addr');
                            $('.device-options[data-addr="' + addr + '"]').toggle($(this).is(':checked'));
                        }).trigger('change');
                    });
                    $('#spinner').hide();
                    $('.config').show();
                }).fail(() => {
                    $('#spinner').hide();
                    $('#devices').html('<tr><td>CCU connection not ready - deploy the CCU config node first</td></tr>');
                    $('.config').show();
                });
            }

            $('#disable-all').click(() => {
                $('.option-hide').prop('checked', false).trigger('change');
            });
            $('#enable-all').click(() => {
                $('.option-hide').prop('checked', true).trigger('change');
            });
        },
        oneditsave() {
            const devices = {};
            $('.channel-option').each(function () {
                const addr = $(this).data('addr');
                const option = $(this).data('option');
                if (!devices[addr]) {
                    devices[addr] = {};
                }
                devices[addr][option] = $(this).val();
            });
            $('.device-enabled:not(.vchannel-enabled)').each(function () {
                const addr = $(this).data('addr');
                const enabled = $(this).is(':checked');
                if (enabled && devices[addr]) {
                    devices[addr].disabled = false;
                } else if (!enabled) {
                    if (!devices[addr]) {
                        devices[addr] = {};
                    }
                    devices[addr].disabled = true;
                }
            });
            $('.device-enabled.vchannel-enabled').each(function () {
                const addr = $(this).data('addr');
                const enabled = $(this).is(':checked');
                if (!enabled && devices[addr]) {
                    devices[addr].enabled = false;
                } else if (enabled) {
                    if (!devices[addr]) {
                        devices[addr] = {};
                    }
                    devices[addr].enabled = true;
                }
            });
            // keep settings of devices that were not listed this time (e.g. CCU
            // temporarily without that interface) instead of dropping them
            Object.keys(this.devices || {}).forEach(addr => {
                if (!devices[addr]) {
                    devices[addr] = this.devices[addr];
                }
            });
            this.devices = devices;
        }
    });
</script>

<script type="text/x-red" data-template-name="redmatic-homekit-homematic-devices">

    <div class="form-row">
        <label for="node-input-ccuConfig"><i class="icon-globe"></i> CCU</label>
        <input type="text" id="node-input-ccuConfig">
    </div>
    <div class="form-row">
        <label for="node-input-bridgeConfig"><i class="icon-globe"></i> Bridge</label>
        <input type="text" id="node-input-bridgeConfig">
    </div>
    <style>
        #devices {
            width: 100%;
        }
        #devices td.text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #devices td.small {
            max-width: 90px;
            font-size: 10px;
        }
        #devices td.enabled {
            width: 16px;
            display: block;
            margin-top: -2px;
        }

        .channel-enabled, .vchannel-enabled {
            width: 11px !important;
            margin-top: -1px !important;
            margin-right: 2px !important;
        }

        select.small {
            width: 100%;
            height: auto;
            padding: 0;
            font-size: 9px;
        }


    </style>
    <div class="form-row">
        <div style="width: 100%; display: flex">
            <img id="spinner" src="red/images/spin.svg" style="margin: auto; display: none;">
        </div>
        <div class="config" style="width: 100%; display: none">
            <button id="disable-all" style="margin-right: 12px;">disable all</button>
            <button id="enable-all">enable all</button>
        </div>
        <table class="config" id="devices"></table>
    </div>

</script>

<script type="text/x-red" data-help-name="redmatic-homekit-homematic-devices">
    <p>Legt für die Geräte einer CCU-Verbindung (node-red-contrib-ccu) automatisch HomeKit-Zubehör an.</p>
    <h3>Geräteliste</h3>
    <p>Die Liste zeigt alle Geräte der aktivierten Schnittstellen, die der Node abbilden kann. Pro Gerät lässt sich
    das Zubehör ein- und ausschalten; darunter erscheinen je nach Gerät die einzelnen Kanäle mit Optionen:</p>
    <dl class="message-properties">
        <dt>Typ-Auswahl</dt><dd>Als was ein Kanal in HomeKit erscheint, z.&nbsp;B. Schalter, Steckdose, Lampe,
            Lüfter, Ventil bei Schaltaktoren oder Kontaktsensor, Tür, Fenster, Garagentor bei Kontakten.</dd>
        <dt>SingleAccessory</dt><dd>Bei mehrkanaligen Aktoren: alle Kanäle in einem Zubehörteil (Standard) oder
            ein eigenes Zubehörteil je Kanal.</dd>
        <dt>Virtuelle Kanäle</dt><dd>Die zweiten und dritten virtuellen Empfängerkanäle von HmIP-Aktoren
            (z.&nbsp;B. <code>:5</code>, <code>:6</code>) und die Taster an Aktoren sind abwählbar und standardmäßig aus.</dd>
        <dt>Battery, HumiditySensor, LightSensor, BoostSwitch, …</dt><dd>Zusätzliche Services, die sich pro
            Gerät abschalten lassen.</dd>
    </dl>
    <h3>Geräteunterstützung</h3>
    <p>Für bekannte Gerätetypen gibt es speziell abgestimmte Module. Alle anderen Geräte werden aus ihrer
    Gerätebeschreibung (Kanaltypen und Datenpunkte) zugeordnet; das umfasst auch neue, Homebrew- und
    CUxD-Geräte. Fehlt ein Gerät, bitte ein Issue mit dem Gerätetyp öffnen.</p>
    <h3>Hinweise</h3>
    <p>Gerätenamen werden von der CCU übernommen (Kanalnamen für Kanäle). Zubehörteile behalten ihre Identität
    über Neustarts und Updates, solange die Geräteadresse gleich bleibt. Nach dem Ändern der Auswahl ist ein
    Deploy nötig; neue Zubehörteile erscheinen in der Home-App im Standardraum.</p>
</script>
